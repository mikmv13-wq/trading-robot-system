[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "trading-robot-system"
version = "0.1.0"
description = "Desktop system for research, validation, and execution of trading robots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2.0",
    "keyring>=25,<27",
    "pydantic-settings>=2.10,<3.0",
    "pytz>=2024.1",
    "PySide6>=6.8,<7.0",
    "t-tech-investments>=1.49.2,<2.0",
    "typer>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1.0",
]

[project.scripts]
trader = "trading_system.cli:app"

[project.gui-scripts]
trader-desktop = "trading_system.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_system"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trading_system"]

[tool.coverage.run]
source = ["trading_system"]
