t_invest:
  token_env: T_INVEST_TOKEN
  base_url: https://invest-public-api.tbank.ru/rest
  request_timeout_seconds: 20
  requests_per_minute: 480
  max_retries: 6
  app_name: trading-robot-system

collector:
  interval: 1m
  # Основная база рассчитана примерно на 5 лет истории.
  history_from: "2021-01-01T00:00:00Z"
  request_window_hours: 24
  overlap_minutes: 5
  candle_source: CANDLE_SOURCE_EXCHANGE
  only_complete: true

storage:
  # Свечи: Parquet, партиции timeframe/instrument/year/month.
  root_path: data/market
  # DuckDB: metadata/checkpoints + SQL views поверх Parquet. Свечи внутрь БД не копируются.
  catalog_path: data/trading.duckdb
  compression: zstd

aggregations:
  enabled: true
  intervals:
    - 15m
    - 30m
    - 1h
  # После сбора пересчитываются только изменившиеся (dirty) месяцы.
  run_after_collect: true

# instrument_id: FIGI, instrument_uid или ticker_classCode, который принимает T-Invest API.
# В рабочей конфигурации предполагается около 30 акций.
instruments:
  - instrument_id: "BBG004730N88"
    ticker: "SBER"
    enabled: true
